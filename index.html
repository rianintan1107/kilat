*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef2f5;color:#1b2a36;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#0b3d5c;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hb{display:flex;align-items:center;gap:10px}.hb .ht{min-width:0;flex:1}.hb .logo{height:36px;width:auto;flex:none;background:#fff;border-radius:7px;padding:4px 6px;box-sizing:content-box}
header h1{margin:0;font-size:15px;line-height:1.25}.hu{font-size:12px;opacity:.85;margin:2px 0}.row select{width:56%;font-size:15px;padding:9px 8px;border:1px solid #cfd8df;border-radius:10px;background:#f9fbfc;color:#1b2a36}.row input.tx{text-align:left;width:56%}
header div{font-size:13px;opacity:.9;margin-top:2px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
summary{font-weight:600;font-size:15px;padding:4px 0;cursor:pointer}
h3{margin:0 0 8px;font-size:15px;color:#0b3d5c}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #eef1f4}
.row span{font-size:14px;flex:1}
.row small{display:block;color:#7a8a97;font-size:11px}
.row input{width:44%;font-size:16px;padding:9px 10px;border:1px solid #cfd8df;border-radius:10px;text-align:right;background:#f9fbfc;color:#1b2a36}
.row input:focus{outline:none;border-color:#1479b8;background:#fff}
.row input.bad{border-color:#d33;background:#fff2f2}
.note{font-size:12px;color:#5b6b78;margin-top:8px;line-height:1.5}
.note.warn{color:#c0392b}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #9fb3c2}
.tile.hi{border-left-color:#1479b8}.tile.ok{border-left-color:#2e9e5b}.tile.bad{border-left-color:#d33}
.tile small{display:block;color:#6b7c89;font-size:11px}
.tile b{display:block;font-size:20px;margin:3px 0}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #eef1f4;font-size:14px}
.kv b small{color:#7a8a97;font-weight:400;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:right;border-top:1px solid #eef1f4}
th:first-child,td:first-child{text-align:left}
th{color:#6b7c89;font-weight:600}
.btns{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;padding:13px;border:0;border-radius:12px;background:#1479b8;color:#fff;font-size:15px;font-weight:600}
.btn.ghost{background:#fff;color:#1479b8;border:1px solid #1479b8}
nav button{min-width:0;flex:1 1 0;font-size:10px;padding-left:1px;padding-right:1px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:#fff;border-top:1px solid #dde3e8;padding-bottom:env(safe-area-inset-bottom)}

nav button.on{color:#0b3d5c;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
summary.small{font-size:13px;font-weight:600;color:#1479b8;margin-top:8px}
.seg{display:flex;background:#eef3f7;border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;font-size:14px;color:#1b2a36}
.seg button.on{background:#fff;color:#1479b8;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-top:1px solid #eef1f4}
.bl select{flex:1;min-width:0;font-size:16px;padding:9px 6px;border:1px solid #cfd8df;border-radius:10px;background:#f9fbfc;color:#1b2a36}
.bl input{width:74px;font-size:16px;padding:9px 8px;border:1px solid #cfd8df;border-radius:10px;text-align:right;background:#f9fbfc;color:#1b2a36}
.bl input.bad{border-color:#d33;background:#fff2f2}
.bl .x{border:0;background:#fdecec;color:#c0392b;border-radius:10px;width:38px;height:38px;font-size:15px}
.bl .bt{flex-basis:100%;font-size:12px;color:#5b6b78}
.fm{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eef1f4;font-size:13px}
.fm small{display:block;color:#7a8a97;font-size:11px}
.fm button{border:1px solid #1479b8;background:#fff;color:#1479b8;border-radius:8px;padding:6px 10px;font-size:13px;margin-left:4px}
.fm button.del{border-color:#c0392b;color:#c0392b}
.row select{width:44%;font-size:16px;padding:9px 6px;border:1px solid #cfd8df;border-radius:10px;background:#f9fbfc}
.ffx{background:#f4f8fb;border-radius:12px;padding:6px 10px;margin-top:8px}
select{font-size:16px;padding:8px;border:1px solid #cfd8df;border-radius:10px;background:#f9fbfc}
.dfrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#1479b8;padding:8px 0 4px}
.dfrow input{width:20px;height:20px}
input.dflt{background:#eef2f5!important;color:#6b7c89!important}
.dfh{display:block;color:#c0392b!important}
.dfbd{font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;font-weight:600}
.dfbd.on{background:#e3f4ea;color:#2e7d4f}.dfbd.off{background:#fdf0e1;color:#b9690e}
/* layout v16: mobile fit + desktop */
img,svg,input,select,textarea{max-width:100%}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:4px 0}
.tw table{min-width:100%}
.note{overflow-wrap:anywhere}
.hh .row{flex-wrap:wrap;align-items:stretch}
.hh .row>span{flex:1 1 100%}
.hh .row input,.hh .row select,.hh .row textarea{width:100%!important;flex:1 1 100%}
.hh [style*="width:2"],.hh [style*="width:1"]{max-width:100%}
.hh label{flex-wrap:wrap}
.hh h4{margin:12px 0 4px;font-size:14px;color:#0b3d5c}
.hh .btns{flex-wrap:wrap}.hh .btns .btn{flex:1 1 140px}
.hh td,.hh th{white-space:normal}
@media (max-width:420px){.btns{flex-wrap:wrap}.btns .btn{flex:1 1 45%}th,td{padding:6px 3px;font-size:12px}}
@media (min-width:900px){
body{padding-bottom:0;padding-left:210px}
nav{top:0;bottom:0;left:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid #dde3e8;padding:16px 10px;gap:4px;overflow-y:auto}
nav button{flex:0 0 auto!important;display:flex;align-items:center;gap:10px;text-align:left;font-size:14px!important;padding:11px 14px!important;border-radius:10px;cursor:pointer}
nav button i{display:inline;font-size:18px}
nav button:hover{background:#eef3f7}
nav button.on{background:#e3eef7}
header{padding:12px 24px}header h1{font-size:18px}.hb .logo{height:44px}
main{max-width:1320px;padding:18px 24px}
main section{column-count:2;column-gap:16px}
main .card,main details.card,main .btns{break-inside:avoid;-webkit-column-break-inside:avoid;display:block}
main .btns{display:flex}
.tiles{column-span:all;grid-template-columns:repeat(4,1fr)}
.card.wide{column-span:all}
.row input{width:38%}.row select{width:44%}
.btn{cursor:pointer}.btn:hover{filter:brightness(1.05)}
}
@media (min-width:1500px){main{max-width:1560px}main section{column-count:3}}
</style>
